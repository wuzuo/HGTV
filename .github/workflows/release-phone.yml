name: Release Phone APK

# 手机端与 TV 端各自独立发版：包名不同、界面不同、出问题互不牵连。
# 推 `phone-v<versionName>` 标签触发；TV 的 `kotlin-v*` 不受影响。
on:
  push:
    tags: ['phone-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. phone-v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-phone-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Resolve the tag being released
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^phone-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Phone release tags must look like phone-v0.1.0, got '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#phone-v}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE: ${{ secrets.HGTV_KEYSTORE_BASE64 }}
        run: |
          # 手机端与 TV 端用同一套签名密钥：没有覆盖安装的约束，共用省得管两套。
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/hgtv-release.jks"
          echo "HGTV_KEYSTORE=$RUNNER_TEMP/hgtv-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          HGTV_STORE_PASSWORD: ${{ secrets.HGTV_STORE_PASSWORD }}
          HGTV_KEY_ALIAS: ${{ secrets.HGTV_KEY_ALIAS }}
          HGTV_KEY_PASSWORD: ${{ secrets.HGTV_KEY_PASSWORD }}
          HGTV_PHONE_VERSION_NAME: ${{ steps.tag.outputs.name }}
          # 手机端没有自动更新通道，versionCode 只用于系统层面区分新旧，
          # 直接取构建序号即可，不必每次都手工加一。
          HGTV_PHONE_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./kotlin-tv/gradlew -p kotlin-tv \
            :playback:testDebugUnitTest \
            :app-phone:lintRelease \
            :app-phone:assembleRelease \
            --console=plain

      - name: Collect APK
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p "outputs/phone/$TAG"
          cp kotlin-tv/app-phone/build/outputs/apk/release/app-phone-release.apk \
             "outputs/phone/$TAG/hgtv-phone-${TAG#phone-v}.apk"
          ( cd "outputs/phone/$TAG" && sha256sum *.apk > sha256sum.txt && cat sha256sum.txt )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # --latest=false：仓库里 TV 端也在发版，应用内更新读的是「最新发行版」。
          # 手机端的 Release 一旦被标成 latest，TV 端就会读到没有更新清单的发行版。
          # 更新内容取标签注释（`git tag -a phone-vX.Y.Z -m "..."`），
          # 免得每次发版都要回来改这个文件。
          notes="$(git tag -l --format='%(contents:body)' "$TAG")"
          [ -n "$notes" ] || notes="手机端。与 TV 端共用协议层与播放层，界面为触摸屏重写。"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --latest=false --title "HGTV 手机端 ${TAG#phone-v}" \
              --notes "$notes"
          gh release upload "$TAG" outputs/phone/"$TAG"/*.apk outputs/phone/"$TAG"/sha256sum.txt --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-release-${{ steps.tag.outputs.tag }}
          path: outputs/phone/${{ steps.tag.outputs.tag }}/
          retention-days: 14
          if-no-files-found: error

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hgtv-release.jks"
